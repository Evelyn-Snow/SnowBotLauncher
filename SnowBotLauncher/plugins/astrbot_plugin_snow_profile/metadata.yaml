name: astrbot_plugin_snow_profile
display_name: Bot 印象笔记
desc: 为每个聊天对象维护第一人称印象笔记，并综合聊天频率、印象分、道德分给出熟悉度；聊天按熟悉度调整分寸，达到阈值会偶尔主动私聊
